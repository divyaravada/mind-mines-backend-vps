<!DOCTYPE html>
<html>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    "
  >
    <div
      style="
        max-width: 640px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e5e5e5;
        overflow: hidden;
      "
    >
      <!-- Header -->
      <div
        style="
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 16px 20px;
          background: #16150f;
        "
      >
        {% with brand=brand_name|default:"MindMines" %} {% if logo_url %}
        <img
          src="{{ logo_url }}"
          alt="{{ brand }}"
          style="height: 32px; display: block"
        />
        {% else %}
        <img
          src="/static/emails/logo.png"
          alt="{{ brand }}"
          style="height: 32px; display: block"
        />
        {% endif %}
        <span
          style="
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #f7f3ed;
          "
        >
          {{ brand }}
        </span>
        {% endwith %}
      </div>

      <!-- Content -->
      <div style="padding: 20px">
        <p style="margin: 0 0 12px">
          <strong>New newsletter subscriber</strong>
        </p>
        <p style="margin: 0 0 16px">
          Email: <code style="font-family: monospace">{{ email }}</code>
        </p>
      </div>

      <!-- Footer -->
      <div
        style="
          padding: 10px 20px 14px;
          background: #fafafa;
          border-top: 1px solid #f0f0f0;
          font-size: 12px;
          color: #777;
          text-align: center;
        "
      >
        <span>{{ site_url|default:"https://mindmines.eu" }}</span>
      </div>
    </div>
  </body>
</html>
